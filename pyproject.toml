[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-echo"
version = "0.1.0"
description = "Project Echo -- AI Media Operating System (STEP 1/2/3 and Efficiency Foundation)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
echo = "echo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
